<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sert Enterprise - Home</title>

    <!-- Body CSS -->
    <link rel="stylesheet" href="./CSS/index.css">
    <!-- Navbar CSS -->
    <link rel="stylesheet" href="./CSS/navbar.css">
    <!-- Hero Section CSS-->
    <link rel="stylesheet" href="./CSS/hero-section.css">
    <!-- Responsiveness -->
    <link rel="stylesheet" href="./CSS/index-responsive.css">
    
</head>

<body>

    <header class="navbar">

        <!-- Left: SERT Logo -->
        <a href="index.html" class="logo">
            <img src="./Assets/Logo/SERT Logo.webp" alt="SERT Enterprise" class="logo-image">
        </a>

        <!-- Center: Main Links -->
        <nav class="nav-menu" id="navMenu">
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="">Services</a></li>
                <li><a href="">Industries</a></li>
                <li><a href="">Materials</a></li>
                <li><a href="">Products</a></li>
                <li><a href="">Service Area</a></li>
                <li><a href="">Contact Us</a></li>
            </ul>
        </nav>

        <!-- Right: Search bar & Login-->
            <div class="nav-right">

                <!-- Search bar -->
                    <form class = "search-form" action = "" method = "get">
                        <input type = "search" name = "search" placeholder = "Search products..." aria-label = "Search products">
                            <button type = "submit" class = "search-button" aria-label = "Search">
                                <svg viewBox = "0 0 24 24" aria-hidden = "true">
                                    <circle cx = "11" cy = "11" r = "7"></circle>
                                    <path d = "m16 16 4 4"></path>
                                </svg>
                            </button>
                        </form>
            
                <!-- Login -->
                    <a href="login.html" class="profile-link"
                        aria-label="Log in to your account" title="Log in">
            
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="8" r="4"></circle>
                            <path d="M4 21v-2a8 8 0 0 1 16 0v2z"></path>
                        </svg>
                    </a>
            </div>  
            
        <!-- Mobile menu button -->
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="navMenu" type="button">
            <span></span>
            <span></span>
            <span></span>
        </button>

    </header>

    <!-- Main content -->
    <main>
        <section class="hero-section">
            <!-- Slideshow Images -->
             <img src = "Assets/Banner/banner 1.webp" alt="Provincial Tourism and Cultural Affairs Office" class="slideshow-image">
             <img src = "Assets/Banner/banner 2.webp" alt="Aventus Medical Care Inc." class="slideshow-image">
             <img src = "Assets/Banner/banner 3.webp" alt="Smilee Apparel" class="slideshow-image">
             <img src = "Assets/Banner/banner 4.webp" alt="Real Casa" class="slideshow-image">
             <img src = "Assets/Banner/banner 5.webp" alt="Wellness Hub" class="slideshow-image">
             <img src = "Assets/Banner/banner 6.webp" alt="Subaru Dealership" class="slideshow-image">
             <img src = "Assets/Banner/banner 7.webp" alt="Fruitas" class="slideshow-image">

            <!-- Overlay -->
            <div class = "banner-overlay"></div>

            <!-- Content: Heading, Tagline, and Button -->
            <div class="banner-content">
                <span class="eyebrow">SERT Enterprise</span>
                <h1 class="main-heading">Crafting Quality<span class="accent">Creating Impact</span></h1>
                <p class="tagline">Your Vision, Our Craft — From Signage to Complete Interior Solutions.</p>
                <a href="./html/products.html" class="btn-get-started">Explore our Service <span aria-hidden="true">&rarr;</span></a>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        
    </footer>
    <!-- Hamburger button mobile -->
    <script>
        const menuToggle = document.getElementById("menuToggle");
        const navMenu = document.getElementById("navMenu");
        const navLinks = document.querySelectorAll("#navLinks a");

        menuToggle.addEventListener("click", () => 
        {
            const isOpen = navMenu.classList.toggle("show");

            menuToggle.setAttribute(
                "aria-expanded",
                String(isOpen)
            );
        });

        navLinks.forEach(link => 
        {
            link.addEventListener("click", () => 
            {
                navMenu.classList.remove("show");
                menuToggle.setAttribute("aria-expanded", "false");
            });
        });

        window.addEventListener("resize", () => 
        {
            if (window.innerWidth > 768) 
            {
                navMenu.classList.remove("show");
                menuToggle.setAttribute("aria-expanded", "false");
            }
        });

        document.querySelector(".search-form").addEventListener("submit", (e) => {e.preventDefault();}); /*remove after building real search function*/
    </script>

</body>
</html>
