<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Laptop showing a customer dashboard with project progress and delivery tracking, a status notification, and a package" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f3ed"/>
      <stop offset="1" stop-color="#e4e0d2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#123c2d" flood-opacity="0.22"/>
    </filter>
    <clipPath id="screen">
      <rect x="184" y="124" width="432" height="272" rx="8"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <g fill="none" stroke="#0c3d20" stroke-opacity="0.08" stroke-width="2">
    <polygon points="70,60 110,37 150,60 150,106 110,129 70,106"/>
    <polygon points="150,106 190,83 230,106 230,152 190,175 150,152"/>
    <polygon points="650,470 690,447 730,470 730,516 690,539 650,516"/>
  </g>

  <!-- Laptop -->
  <ellipse cx="400" cy="450" rx="310" ry="22" fill="#123c2d" opacity="0.12"/>
  <g filter="url(#shadow)">
    <rect x="170" y="110" width="460" height="300" rx="16" fill="#123c2d"/>
    <rect x="110" y="410" width="580" height="18" rx="9" fill="#0c2a1f"/>
    <rect x="350" y="410" width="100" height="7" rx="3.5" fill="#1d5240"/>
  </g>

  <!-- Screen content -->
  <rect x="184" y="124" width="432" height="272" rx="8" fill="#f5f3ed"/>
  <g clip-path="url(#screen)">
    <!-- Sidebar -->
    <rect x="184" y="124" width="66" height="272" fill="#123c2d"/>
    <rect x="198" y="142" width="38" height="10" rx="5" fill="#d97a1c"/>
    <rect x="198" y="174" width="38" height="8" rx="4" fill="#ffffff" opacity="0.55"/>
    <rect x="198" y="198" width="38" height="8" rx="4" fill="#ffffff" opacity="0.55"/>
    <rect x="198" y="222" width="38" height="8" rx="4" fill="#ffffff" opacity="0.55"/>
    <rect x="198" y="246" width="38" height="8" rx="4" fill="#ffffff" opacity="0.55"/>

    <!-- Title + quick actions -->
    <rect x="266" y="140" width="150" height="12" rx="6" fill="#0c3d20"/>
    <rect x="266" y="164" width="90" height="24" rx="6" fill="#d97a1c"/>
    <rect x="364" y="164" width="90" height="24" rx="6" fill="#ffffff" stroke="#123c2d" stroke-opacity="0.25"/>

    <!-- Projects card -->
    <rect x="266" y="200" width="334" height="86" rx="10" fill="#ffffff"/>
    <rect x="282" y="214" width="100" height="8" rx="4" fill="#0c3d20" opacity="0.85"/>
    <rect x="500" y="211" width="84" height="14" rx="7" fill="#123c2d" opacity="0.12"/>
    <rect x="282" y="232" width="302" height="7" rx="3.5" fill="#e6e4dc"/>
    <rect x="282" y="232" width="196" height="7" rx="3.5" fill="#d97a1c"/>
    <rect x="282" y="252" width="80" height="8" rx="4" fill="#0c3d20" opacity="0.85"/>
    <rect x="500" y="249" width="84" height="14" rx="7" fill="#d97a1c" opacity="0.18"/>
    <rect x="282" y="268" width="302" height="7" rx="3.5" fill="#e6e4dc"/>
    <rect x="282" y="268" width="60" height="7" rx="3.5" fill="#d97a1c"/>

    <!-- Delivery card -->
    <rect x="266" y="298" width="334" height="84" rx="10" fill="#ffffff"/>
    <rect x="282" y="312" width="90" height="8" rx="4" fill="#0c3d20" opacity="0.85"/>
    <line x1="300" y1="345" x2="566" y2="345" stroke="#d9d7cf" stroke-width="3" stroke-linecap="round"/>
    <line x1="300" y1="345" x2="478" y2="345" stroke="#123c2d" stroke-width="3" stroke-linecap="round"/>
    <circle cx="300" cy="345" r="7" fill="#123c2d"/>
    <circle cx="389" cy="345" r="7" fill="#123c2d"/>
    <circle cx="478" cy="345" r="11" fill="#d97a1c" opacity="0.25"/>
    <circle cx="478" cy="345" r="7" fill="#d97a1c"/>
    <circle cx="566" cy="345" r="7" fill="#d9d7cf"/>
    <rect x="282" y="362" width="36" height="6" rx="3" fill="#b8b6ae"/>
    <rect x="371" y="362" width="36" height="6" rx="3" fill="#b8b6ae"/>
    <rect x="460" y="362" width="36" height="6" rx="3" fill="#b8b6ae"/>
    <rect x="548" y="362" width="36" height="6" rx="3" fill="#b8b6ae"/>
  </g>

  <!-- Notification card -->
  <g transform="translate(520 56)" filter="url(#shadow)">
    <rect width="236" height="76" rx="14" fill="#ffffff"/>
    <circle cx="40" cy="38" r="21" fill="#d97a1c"/>
    <g transform="translate(40 37)" fill="#ffffff">
      <path d="M0 -10 a7.5 7.5 0 0 1 7.5 7.5 v6 l3.5 3.5 h-22 l3.5 -3.5 v-6 a7.5 7.5 0 0 1 7.5 -7.5z"/>
      <circle cx="0" cy="11" r="2.8"/>
    </g>
    <text x="76" y="33" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#0c3d20">Status update</text>
    <text x="76" y="53" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#4a524d">Your project is in production</text>
    <circle cx="214" cy="20" r="5" fill="#d97a1c"/>
  </g>

  <!-- Package -->
  <g transform="translate(46 410) scale(0.85)" filter="url(#shadow)">
    <polygon points="80,0 160,38 80,76 0,38" fill="#ecc07f"/>
    <polygon points="0,38 80,76 80,170 0,132" fill="#d99a4a"/>
    <polygon points="80,76 160,38 160,132 80,170" fill="#c4832f"/>
    <line x1="40" y1="19" x2="120" y2="57" stroke="#f5f3ed" stroke-width="14" opacity="0.9"/>
    <polygon points="68,70 92,81 92,175 68,164" fill="#f5f3ed" opacity="0.0"/>
    <polygon points="60,66 80,76 80,168 60,158" fill="#f5f3ed" opacity="0.55"/>
  </g>

  <!-- Delivered check badge -->
  <g transform="translate(704 506)" filter="url(#shadow)">
    <circle r="36" fill="#123c2d"/>
    <circle r="36" fill="none" stroke="#d97a1c" stroke-width="3" opacity="0.9"/>
    <path d="M-14 1 L-4 11 L15 -10" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
